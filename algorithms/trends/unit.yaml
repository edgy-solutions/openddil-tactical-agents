apiVersion: openddil.io/algorithm/v1
unit: trends
version: "1.0.0"
runtime: stream-parallel          # ADR-0034 execution class; the only one this runner accepts
entrypoint: trends.py:Trends
key: asset_id
composition: propagating          # ADR-0034 composition typing
inputs:
  topic: raw-sensor-stream
  roles:
    - {role: record_time_ns, required: true}   # the input record's broker time: the clock for every sample and window
    - {role: fuel_remaining}
    - {role: consumables}
    - {role: wear_hours}
    - {role: wear_rul}
    - {role: active_fault_codes}
params:                            # every tunable constant; defaults = the old in-line path's values
  fluid_window_min:     {type: number,  default: 15,   minimum: 0, unit: min}
  wear_window_min:      {type: number,  default: 60,   minimum: 0, unit: min}
  emit_every_n_samples: {type: integer, default: 5,    minimum: 1}
  window_cap:           {type: integer, default: 4096, minimum: 2}   # samples kept per signal
state:
  persistence: memory              # lost on a restart, as the old in-line buffers were; trends refill from the live feed
  fields:
    buffers:            {type: object,  default: {}}    # signal key -> its samples
    samples_since_emit: {type: integer, default: 0}
outputs:
  - kind: window                   # WindowedTelemetry on asset-telemetry-windows
    topic: asset-telemetry-windows
    direction: local               # local | upward; terminal + upward is refused
    producer_id: faust-edge
    source_protocol: openddil.trends.v1
    labels: copy-source            # the only accepted value until ADR-0055 (high-water)
resources: {memory_mi: 59, cpu_m: 5}   # the larger edge's measured peak and mean cpu, no margin; leaves out Faust and RocksDB overhead, broker client buffers and the pod's own CPU (host is not the edge node)
measured:
  date: "2026-11-09"
  recording: "second lab, rev 30, t0 2026-11-08T02:12:42Z, through the 02:23Z pull"
  basis: recorded-timing-synthetic-values
  host: "lane 03 dev host, not the edge node; python 3.11.1"
  records: 157689
  assets: 9
  rate_per_s: 1.799
  per_sample_us: {mean: 2310.81, p99: 17542.2, max: 75752.5}
  peak_python_mib: 58.956
  state_bytes_per_asset: 6852031
dependencies: []                   # must be empty: dependencies ship in the image, never fetched
