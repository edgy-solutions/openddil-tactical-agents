apiVersion: openddil.io/algorithm/v1
unit: thermal
version: "1.0.0"
runtime: stream-parallel          # ADR-0034 execution class; the only one this runner accepts
entrypoint: thermal.py:ThermalRunaway
key: asset_id
composition: propagating          # ADR-0034 composition typing
inputs:
  topic: raw-sensor-stream
  roles:
    - {role: component_temp_k, required: true}
    - {role: ambient_temp_k, required: true}
params:                            # every tunable constant; defaults = the original rule's values
  delta_threshold_k:             {type: number, default: 80.0, minimum: 0, unit: K}
  rate_threshold_k_per_sample:   {type: number, default: 2.0,  minimum: 0, unit: K}   # per sample, not per second
  ewma_alpha:                    {type: number, default: 0.2,  minimum: 0, maximum: 1}
state:
  table: thermal_runaway_state
  partitions: 1
  record_namespace: thermal.unit._ThermalRunawayRecord
  fields:                          # production's stored defaults, so the warm-up of the average is kept
    last_temp_k:  {type: number, default: 0.0}
    # The EWMA is kept for state equivalence with the original rule and is
    # unused in the decision. Changing that is a design decision for Chris,
    # not part of this port.
    temp_ewma_k:  {type: number, default: 0.0}
outputs:
  - kind: anomaly                  # a CloudEvent on tactical-events
    topic: tactical-events
    direction: local               # local | upward; terminal + upward is refused
    producer_id: thermal-derivation
    source_protocol: openddil.thermal.v1
    labels: copy-source            # the only accepted value until ADR-0055 (high-water)
    event_type: openddil.anomaly.thermal.runaway.v1
    severity: critical
resources: {memory_mi: 1, cpu_m: 1}   # the larger edge's measured peak and mean cpu, no margin; leaves out Faust and RocksDB overhead, broker client buffers and the pod's own CPU (host is not the edge node)
measured:
  date: "2026-11-09"
  recording: "second lab, rev 30, t0 2026-11-08T02:12:42Z, through the 02:23Z pull"
  basis: recorded-timing-synthetic-values
  host: "lane 03 dev host, not the edge node; python 3.11.1"
  records: 157689
  assets: 9
  rate_per_s: 1.799
  per_sample_us: {mean: 65.73, p99: 149.8, max: 398707.1}
  peak_python_mib: 0.124
  state_bytes_per_asset: 120
dependencies: []                   # must be empty: dependencies ship in the image, never fetched
