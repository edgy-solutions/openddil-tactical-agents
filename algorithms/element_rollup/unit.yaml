apiVersion: openddil.io/algorithm/v1
unit: element_rollup
version: "1.0.0"
runtime: stream-parallel          # ADR-0034 execution class; the only one this runner accepts
entrypoint: element_rollup_unit.py:ElementRollup
key: asset_id
composition: propagating          # ADR-0034 composition typing
inputs:
  topic: asset-element-telemetry
  format: json-envelope           # the element snapshot; the host gates it (object, asset id, a rollup) before the step
  roles:
    - {role: element_values, required: true}  # every element, unfiltered: an element with no id still counts
    - {role: observed_at_ns}                  # int, or None when the envelope carries none
    - {role: profile_name}
    - {role: operational}                     # core_temp_c, uptime_hours and the condition block
    - {role: envelope_labels}                 # (originator nation, releasable_to) as the envelope states them
    - {role: platform_variant}
params:                            # THREE COPIES of these two numbers: here, the frontend card's bands
                                   # (openddil-demo TelemetryCharts), and element_bands' limits. Change all or none:
                                   # the edge card and the region rollup must show the same counts.
  health_critical: {type: number, default: 0.97, minimum: 0, maximum: 1, unit: "1"}   # health strictly above this is critical
  health_degraded: {type: number, default: 0.90, minimum: 0, maximum: 1, unit: "1"}   # strictly above this (and not critical) is degraded
state:
  persistence: memory              # the declaration needs a state field; this one only counts envelopes
  fields:
    envelopes_seen: {type: integer, default: 0}
outputs:
  - kind: element_window           # the element path's WindowedTelemetry on the windows topic
    topic: asset-telemetry-windows
    direction: upward
    stamp: none                    # the window carries no unit stamp, as before; the host supplies producer faust-edge
    labels: copy-source
resources: {memory_mi: 8, cpu_m: 10}   # unmeasured; a ceiling until the measure step replaces it
dependencies: []                   # must be empty: dependencies ship in the image, never fetched
