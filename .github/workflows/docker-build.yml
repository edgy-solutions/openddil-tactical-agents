name: Docker Build

on:
  push:
    branches: [ "master" ]
    # Tag pushes (v1.0.0, ...) publish versioned images (:v1.0.0)
    # so consumers can pin to a release. A tag does not move :latest.
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# All images publish under ghcr.io/edgy-solutions/openddil/<service>.
#
# Tags, on every image:
#   :sha-<7>  every build, from the commit it built. On a pull request that is
#             the branch head, not GitHub's merge commit, so the tag names a
#             commit that exists on the branch.
#   :pr-<N>   a pull request build.
#   :<tag>    a v* tag push.
#   :latest   a push or a dispatch on master, and nothing else. A branch, a
#             pull request or a tag never moves it.
# A pull request from a fork builds but pushes nothing: its token cannot write
# packages.
#
# `${{ github.repository_owner }}` resolves to `edgy-solutions` for this repo.
# The openddil-demo base compose references each of these images directly.
# A pull request publishes its :sha-<7> and :pr-<N> images, never :latest, so
# an unmerged branch reaches a cluster only when it is pinned by its sha.

jobs:
  # The Hero-scenario edge agent referenced by openddil-demo/docker-compose.yml
  # as `image: ghcr.io/edgy-solutions/openddil/faust-edge:latest`. Includes
  # the Phase 3.5 rolling-window agent (detection/windows.py).
  build-faust-edge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<7> always, :pr-<N> on a pull request, :<tag> on a v* tag;
      # :latest only from master.
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/faust-edge
          T="$REG:sha-${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build faust-edge
        uses: docker/build-push-action@v4
        with:
          context: ./edge
          file: ./edge/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}

  # Legacy Faust detector (separate codepath from the Hero faust_edge agent
  # above). Kept building while consumers exist; not referenced by the demo
  # base compose today.
  build-edge-faust-detector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<7> always, :pr-<N> on a pull request, :<tag> on a v* tag;
      # :latest only from master.
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/edge-faust-detector
          T="$REG:sha-${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build edge-faust-detector
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./edge/faust/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
          target: production

  # Legacy Restate detector. Same situation as above.
  build-edge-restate-detector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<7> always, :pr-<N> on a pull request, :<tag> on a v* tag;
      # :latest only from master.
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/edge-restate-detector
          T="$REG:sha-${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build edge-restate-detector
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./edge/restate/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
          target: production

  # Hub-side Restate projector referenced by openddil-demo/docker-compose.yml
  # as `image: ghcr.io/edgy-solutions/openddil/hub-restate-projector:latest`.
  build-hub-restate-projector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<7> always, :pr-<N> on a pull request, :<tag> on a v* tag;
      # :latest only from master.
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/hub-restate-projector
          T="$REG:sha-${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build hub-restate-projector
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./hub/projector/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
          target: production

  # Regional aggregator (Phase 6b) referenced by openddil-demo/
  # docker-compose.yml as `image: ghcr.io/edgy-solutions/openddil/
  # faust-regional:latest` and by the openddil-helm chart. Previously this
  # image was ONLY built locally via docker-compose.override.yml's
  # `build:` block — compose-mode users never noticed it was absent from
  # ghcr.io, but helm deployments (which pull, not build) fail with
  # "faust-regional:latest: not found". This job closes that gap.
  build-faust-regional:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<7> always, :pr-<N> on a pull request, :<tag> on a v* tag;
      # :latest only from master.
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/faust-regional
          T="$REG:sha-${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build faust-regional
        uses: docker/build-push-action@v4
        with:
          context: ./regional
          file: ./regional/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
