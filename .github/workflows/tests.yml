name: Tests

# The produces manifest (produces.yaml) must equal what the Faust apps can write,
# so a new Table, topic or send site fails here in the PR that adds it. The
# regional suite runs beside it.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: edgy-solutions/openddil-contracts
          path: openddil-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libsnappy-dev
          pip install "faust-streaming>=0.10.0" "aiokafka<0.12.0" python-snappy pyyaml watchdog pint==0.24.4 \
            "protobuf>=6.30.0,<7.0.0" pytest "pytest-asyncio==1.3.0"
      # gen/ is gitignored in openddil-contracts, so the checkout supplies only
      # proto/. Generate after the install, pinned to the installed protobuf
      # runtime (the order openddil-cm-service's python-checks.yml explains),
      # and prove one module imports before any test runs.
      - name: Generate protobuf bindings
        run: |
          PB=$(python -c "import google.protobuf as p; print(p.__version__)")
          pip install "grpcio-tools" "protobuf==$PB"
          cd openddil-contracts
          make python PROTOC="python -m grpc_tools.protoc"
          echo "generated $(find gen/python -name '*_pb2.py' | wc -l) protobuf modules"
          PYTHONPATH=gen/python python -c "from openddil.telemetry.v1 import telemetry_pb2; from openddil.common.v1 import ucum"
      - name: produces manifest equals the code
        env:
          PYTHONPATH: ${{ github.workspace }}/openddil-contracts/gen/python
        run: python -m pytest -q tests/test_produces_manifest.py
      - name: regional suite
        env:
          PYTHONPATH: ${{ github.workspace }}/openddil-contracts/gen/python
        run: cd regional && python -m pytest -q
      # Needs the contracts commit that adds Provenance.producer_stamp; until
      # that is pushed, the checkout above has no such field and this step
      # fails by design (the runner refuses to start without it).
      - name: algorithm runtime, wear unit and equivalence
        env:
          PYTHONPATH: ${{ github.workspace }}/openddil-contracts/gen/python
        run: |
          pip install jsonschema
          python -m pytest -q tests
      # edge/tests import faust_edge, which registers the enabled units, so the
      # runner's five variables (the last two are the pod's limits) are set here as the deployment sets them.
      - name: edge suite
        env:
          PYTHONPATH: ${{ github.workspace }}/openddil-contracts/gen/python
          OPENDDIL_EDGE_ID: edge-test
          ALGORITHMS_ENABLED: wear,thermal,trends,posture,element_bands,element_rollup
          ALGORITHMS_DIR: ${{ github.workspace }}/algorithms
          ALGORITHMS_MEMORY_LIMIT_MI: "1024"
          ALGORITHMS_CPU_LIMIT_M: "1000"
        run: python -m pytest -q edge/tests
      # The offline replay harness, on synthetic recordings with the frozen
      # oracle playing production (includes the 200k-record memory bound).
      - name: replay harness
        env:
          PYTHONPATH: ${{ github.workspace }}/openddil-contracts/gen/python
        run: python -m pytest -q tests/test_replay.py
